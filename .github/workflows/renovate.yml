name: Renovate

# One runner for every connected repository, instead of one Dependabot
# configuration and one merge workflow per repository.
#
# Daily at noon, German time. Updates are only proposed on Mondays (see the
# schedule in default.json), but Renovate merges a pull request on the run
# after its checks have turned green — so the Monday run opens the pull
# requests and the Tuesday run merges the green ones. Run by hand to merge
# sooner.
on:
  schedule:
    - cron: "0 12 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

# Two runs on the same repository would race for the same branches.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The React projects install @stefgo/* from GitHub Packages, see below.
      packages: read
    steps:
      # A GitHub App token, not GITHUB_TOKEN: pull requests opened with
      # GITHUB_TOKEN start no workflows, so Tests and Validate would never run
      # and nothing would ever be merged. Not a personal token either — the
      # updates should not appear as the maintainer's own work.
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # The commit author is the app's bot account. Its noreply address needs
      # the numeric user id, which only the API knows.
      - name: Resolve bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          echo "username=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "author=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          token: ${{ steps.app.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Listed explicitly: a repository is connected by adding it to the
          # app's installation and here, and nothing joins by accident.
          RENOVATE_REPOSITORIES: >-
            [
              "stefgo/renovate-config",
              "stefgo/ha-log-notifier",
              "stefgo/ha-crowdsec-integration",
              "stefgo/ha-dmarc-monitor",
              "stefgo/ha-statistics-legend-table",
              "stefgo/ha-statistics-extended-graph",
              "stefgo/dns-provider-manager",
              "stefgo/keepalived-status-monitor",
              "stefgo/docker-instance-manager",
              "stefgo/samba-ad-manager",
              "stefgo/proxmox-backup-client-manager",
              "stefgo/react-ui-components"
            ]
          # @stefgo/* comes from GitHub Packages, whose npm registry asks for a
          # token even for a public package. This job's GITHUB_TOKEN (packages:
          # read) is enough, and unlike a personal token it never expires. The
          # host rule serves the lookups; NPM_TOKEN serves the lock file update,
          # where npm reads the repository's .npmrc and its ${NPM_TOKEN}. Should
          # the package become private, both need a classic PAT with
          # read:packages instead.
          RENOVATE_HOST_RULES: >-
            [{"matchHost": "npm.pkg.github.com", "hostType": "npm", "token": "${{ secrets.GITHUB_TOKEN }}"}]
          RENOVATE_CUSTOM_ENV_VARIABLES: >-
            {"NPM_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}
          # A repository takes part only with its own renovate config; there
          # is no onboarding pull request to wait for.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_USERNAME: ${{ steps.bot.outputs.username }}
          RENOVATE_GIT_AUTHOR: ${{ steps.bot.outputs.author }}
          # Commits through the API are signed by GitHub and show as verified.
          RENOVATE_PLATFORM_COMMIT: enabled
